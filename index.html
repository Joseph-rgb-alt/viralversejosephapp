<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VIRALVERSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              neon: {
                blue: '#00f3ff',
                purple: '#bc13fe',
                green: '#0aff0a',
                pink: '#ff00ff',
                red: '#ff0055',
                yellow: '#ffd700',
                orange: '#ff8c00'
              },
              dark: {
                900: '#0a0a0a',
                800: '#121212',
                700: '#1e1e1e'
              }
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 3s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.5s ease-out forwards',
              'glitch': 'glitch 1s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Handle Safe Areas for Notch Phones */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      body {
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
        /* Prevent pull-to-refresh on mobile */
        overscroll-behavior-y: none;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #121212;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f3ff;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* --- Letter Droplet Animation --- */
      .letter-drop {
        position: absolute;
        top: -100px; /* Start off screen */
        width: 40px;
        height: 40px;
        border-radius: 0 50% 50% 50%;
        transform: rotate(45deg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 1.2rem;
        color: white;
        box-shadow: inset 2px 2px 5px rgba(255,255,255,0.5), 0 0 10px currentColor;
        backdrop-filter: blur(2px);
        z-index: 50;
        opacity: 0;
      }
      
      .letter-drop span {
        transform: rotate(-45deg); /* Counter rotate text to be upright */
      }

      /* Animation: Fall and Land */
      .animate-drop-land {
        animation: dropLand 0.8s cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }

      @keyframes dropLand {
        0% {
          top: -10%;
          opacity: 0;
          transform: rotate(45deg) scale(0.5);
        }
        20% {
          opacity: 1;
        }
        100% {
          top: 45%; /* Target vertical center */
          transform: rotate(45deg) scale(1.5);
          border-radius: 50%; /* Turn into a circle/splash on impact */
          opacity: 1;
        }
      }

      /* Animation: Explode/Morph into Text */
      .text-morph {
        animation: morphToText 0.5s ease-out forwards;
      }

      @keyframes morphToText {
        0% {
          border-radius: 50%;
          background: currentColor;
          transform: scale(1.5);
          box-shadow: 0 0 20px currentColor;
        }
        100% {
          border-radius: 0;
          background: transparent;
          transform: scale(2);
          box-shadow: none;
          text-shadow: 0 0 20px currentColor;
        }
      }

      /* Subtitle Imprint */
      .imprint-letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(20px) scale(1.5);
        filter: blur(4px);
        animation: imprint 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes imprint {
        0% {
          opacity: 0;
          transform: translateY(20px) scale(1.5);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      /* Rotating Loader Text */
      .rotating-text-circle {
        animation: rotateText 10s linear infinite;
      }
      @keyframes rotateText {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* --- Running Water / Rain Animation --- */
      .rain-streak {
        position: absolute;
        top: -10vh;
        width: 2px;
        background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8));
        filter: drop-shadow(0 0 2px currentColor);
        animation: rainFall linear infinite;
        opacity: 0;
      }

      @keyframes rainFall {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(110vh);
          opacity: 0;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-dark-900 text-white overflow-hidden h-screen w-screen selection:bg-neon-blue selection:text-black">
    <div id="root"></div>
  </body>
</html>
